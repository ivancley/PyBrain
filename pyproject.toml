[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-lifecycle"
version = "0.0.0"
description = "Memória persistente, contextual e bitemporal para agentes de IA sobre PostgreSQL + pgvector. Embarcada, agnóstica de framework e de provedor."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ivancley Brito" }]
keywords = ["ai", "agents", "memory", "bitemporal", "postgresql", "pgvector"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# O core tem zero dependências obrigatórias (CLAUDE.md, regra 4). Todo o resto é extra.
dependencies = []

[project.optional-dependencies]
psycopg = ["psycopg[binary]>=3.1", "psycopg-pool>=3.1"]
django = ["django>=4.2"]
sqlalchemy = ["sqlalchemy>=2.0"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.15",
  "mypy>=1.10",
  "psycopg[binary]>=3.1",
  "psycopg2-binary>=2.9.13",
  "psycopg-pool>=3.3.3",
  "django>=4.2",
  "sqlalchemy>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_lifecycle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# `scripts/` é importado por tests/tooling sem estar instalado.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".claude", "*.md", "reports"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "B", "UP", "N",
  "C90",   # mccabe — complexidade ciclomática
  "D",     # pydocstyle — docstrings
  "PLR0912", "PLR0913", "PLR0915",  # ramos, argumentos e instruções demais
  "G",     # flake8-logging-format — sem %s/f-string/format em mensagem de log
  "LOG",   # flake8-logging
]
ignore = [
  "E501",
  "D401",  # docstrings bilíngues (EN + PT) — a heurística de modo imperativo erra no PT
  "D100",  # módulo sem docstring — opcional
  "D104",  # __init__ de pacote sem docstring
  "D105",  # método mágico
  "D106",  # classe aninhada
  "D107",  # __init__ — a classe o documenta
  "D203",  # conflita com D211
  "D212",  # conflita com D213
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Testes e ferramental: exigir docstring ali é ruído, não documentação.
"tests/**" = ["D"]
"scripts/**" = ["D", "C90", "PLR"]
# O app de teste ficou em português (ADR 0010): sua exceção usa o prefixo "Erro".
"app_de_teste/**" = ["N818"]
# A superfície pública é rica em argumentos nomeados de propósito (ADR 0001): todo campo
# opcional de uma versão é argumento nomeado, então o limite de argumentos não se aplica ali.
"src/memory_lifecycle/api.py" = ["PLR0913"]
"src/memory_lifecycle/_reads.py" = ["PLR0913"]  # `recall`, da mesma superfície pública

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/memory_lifecycle"]
branch = true

[tool.coverage.report]
exclude_also = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
