# Só o banco da suíte. A biblioteca é embarcada: não há container de app.
# Porta 5433 no host para não colidir com um Postgres local na 5432.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memory_lifecycle
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory_lifecycle"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
