<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainiac — chat de teste</title>
<style>
  :root {
    --fundo: #f6f5f2; --cartao: #ffffff; --texto: #1f2328; --suave: #6b7280;
    --borda: #e5e3de; --acento: #e8590c; --acento-texto: #ffffff; --usuario: #fff1e6;
    --ok: #2f9e44; --aviso: #e67700; --erro: #c92a2a; --info: #1971c2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #17181a; --cartao: #212226; --texto: #e9e9ea; --suave: #9aa0a6;
      --borda: #33353a; --acento: #ff8a3d; --acento-texto: #17181a; --usuario: #3a2a1f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--fundo); color: var(--texto); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 12px 16px; border-bottom: 1px solid var(--borda); background: var(--cartao); }
  header h1 { margin: 0; font-size: 17px; }
  header small { color: var(--suave); font-family: ui-monospace, monospace; }
  .pessoa { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; font-size: 14px; }
  .pessoa select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--borda); background: var(--fundo); font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: calc(100vh - 57px); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } }
  #chat { display: flex; flex-direction: column; min-height: 0; }
  #mensagens { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  @media (max-width: 860px) { #mensagens { min-height: 55vh; } }
  .balao { max-width: 78%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap;
           background: var(--cartao); border: 1px solid var(--borda); }
  .balao.usuario { align-self: flex-end; background: var(--usuario); }
  .balao.pensando { color: var(--suave); font-style: italic; }
  .eventos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .evento { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .evento.lembrar { color: var(--ok); } .evento.substituir, .evento.corrigir { color: var(--info); }
  .evento.encerrar, .evento.ignorada { color: var(--aviso); } .evento.erro { color: var(--erro); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--borda); background: var(--cartao); }
  input, select, button { font: inherit; color: inherit; }
  #pergunta { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--borda); background: var(--fundo); }
  button { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--borda); background: var(--cartao); cursor: pointer; }
  button.primario { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }
  button:disabled { opacity: .6; cursor: wait; }
  aside { border-left: 1px solid var(--borda); background: var(--cartao); padding: 16px; overflow-y: auto; }
  @media (max-width: 860px) { aside { border-left: 0; border-top: 1px solid var(--borda); } }
  aside h2 { font-size: 15px; margin: 0 0 8px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .filtros select, .filtros input { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--borda); background: var(--fundo); }
  .memoria { border: 1px solid var(--borda); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .memoria .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--acento); }
  .memoria .tempo { font-size: 12px; color: var(--suave); }
  .memoria button { font-size: 12px; padding: 2px 8px; margin-top: 4px; }
  .versoes { margin-top: 6px; font-size: 12px; border-left: 2px solid var(--borda); padding-left: 8px; }
  .versoes div { margin-bottom: 4px; }
  .vazio { color: var(--suave); font-size: 14px; }
  .acoes { display: flex; gap: 6px; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>🧠 Brainiac, o assistente bem-humorado</h1>
  <div class="pessoa">
    <label for="pessoa">Conversando como</label>
    <select id="pessoa">
      {% for nome, id in pessoas %}<option value="{{ id }}"{% if id == dono_id %} selected{% endif %}>{{ nome }}</option>{% endfor %}
    </select>
    <small id="dono" title="dono_id desta pessoa">{{ dono_id }}</small>
  </div>
</header>
<main>
  <section id="chat">
    <div id="mensagens"></div>
    <form id="formulario">
      <input id="pergunta" autocomplete="off" placeholder="Pergunte ou conte algo sobre você…" autofocus>
      <button class="primario" id="enviar">Enviar</button>
    </form>
  </section>
  <aside>
    <h2>O que o Brainiac sabe de <span id="nome-pessoa"></span></h2>
    <div class="filtros">
      <select id="modo">
        <option value="agora">agora</option>
        <option value="como_em">como_em (verdade em…)</option>
        <option value="sabido_em">sabido_em (o que sabíamos em…)</option>
      </select>
      <input id="instante" type="datetime-local" step="1" hidden>
      <button id="atualizar" type="button">Atualizar</button>
    </div>
    <div id="lista"><p class="vazio">Carregando…</p></div>
    <div class="acoes">
      <button id="esquecer" type="button">Esquecer tudo</button>
      <button id="limpar" type="button">Limpar a conversa</button>
    </div>
  </aside>
</main>
<script>
  const csrfDaPagina = "{{ csrf_token }}";
  const csrf = () => (document.cookie.match(/(?:^|; )chat_teste_csrftoken=([^;]*)/) || [])[1] || csrfDaPagina;
  const $ = (id) => document.getElementById(id);
  const BOAS_VINDAS = "E aí! Sou o Brainiac. Pergunte qualquer coisa básica, e me conte de você: eu lembro (e prometo só rir junto). 😄";

  // A conversa de cada pessoa fica neste navegador; a memória fica no banco.
  const chave = (dono) => "chat_teste_conversa_" + dono;
  function lerConversa(dono) {
    try { return JSON.parse(localStorage.getItem(chave(dono)) || "[]"); } catch (e) { return []; }
  }
  function gravarConversa(dono, conversa) {
    try { localStorage.setItem(chave(dono), JSON.stringify(conversa.slice(-60))); } catch (e) {}
  }
  let dono = $("pessoa").value;
  let conversa = lerConversa(dono);

  function elemento(tag, classe, texto) {
    const el = document.createElement(tag);
    if (classe) el.className = classe;
    if (texto !== undefined) el.textContent = texto;
    return el;
  }

  function balao(texto, classe, eventos) {
    const el = elemento("div", "balao " + (classe || ""), texto);
    if (eventos && eventos.length) {
      const caixa = elemento("div", "eventos");
      for (const ev of eventos) caixa.appendChild(elemento("span", "evento " + ev.tipo, ev.tipo + ": " + ev.texto));
      el.appendChild(caixa);
    }
    $("mensagens").appendChild(el);
    $("mensagens").scrollTop = $("mensagens").scrollHeight;
    return el;
  }

  function mostrarConversa() {
    $("mensagens").replaceChildren();
    balao(BOAS_VINDAS);
    for (const m of conversa) balao(m.texto, m.papel === "usuario" ? "usuario" : "", m.eventos);
    $("nome-pessoa").textContent = $("pessoa").selectedOptions[0].textContent;
    $("dono").textContent = dono;
  }

  async function chamar(url, opcoes) {
    const resposta = await fetch(url, opcoes);
    const dados = await resposta.json().catch(() => ({ erro: "resposta inválida (" + resposta.status + ")" }));
    if (!resposta.ok) throw new Error(dados.erro || resposta.statusText);
    return dados;
  }

  function postar(url, corpo) {
    return chamar(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": csrf() },
      body: JSON.stringify(corpo || {}),
    });
  }

  const quando = (iso) => iso ? new Date(iso).toLocaleString("pt-BR") : "aberto";

  $("formulario").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const pergunta = $("pergunta").value.trim();
    if (!pergunta) return;
    const donoDoTurno = dono;
    $("pergunta").value = "";
    $("enviar").disabled = true;
    $("pessoa").disabled = true;
    balao(pergunta, "usuario");
    const pensando = balao("O Brainiac está pensando numa piada…", "pensando");
    try {
      const historico = conversa.map((m) => ({ papel: m.papel, texto: m.texto }));
      const dados = await postar("/api/mensagem", { pergunta, historico });
      pensando.remove();
      balao(dados.resposta, "", dados.eventos);
      conversa.push({ papel: "usuario", texto: pergunta }, { papel: "agente", texto: dados.resposta, eventos: dados.eventos });
      gravarConversa(donoDoTurno, conversa);
      carregarMemorias();
    } catch (erro) {
      pensando.className = "balao";
      pensando.textContent = "";
      pensando.appendChild(elemento("span", "evento erro", "⚠️ " + erro.message));
    } finally {
      $("enviar").disabled = false;
      $("pessoa").disabled = false;
      $("pergunta").focus();
    }
  });

  async function carregarMemorias() {
    const modo = $("modo").value;
    const parametros = new URLSearchParams({ modo });
    if (modo !== "agora") {
      if (!$("instante").value) { $("lista").replaceChildren(elemento("p", "vazio", "Escolha um instante.")); return; }
      parametros.set("instante", $("instante").value);
    }
    try {
      const dados = await chamar("/api/memorias?" + parametros);
      if (!dados.memorias.length) { $("lista").replaceChildren(elemento("p", "vazio", "Nada por aqui.")); return; }
      $("lista").replaceChildren(...dados.memorias.map(cartaoDeMemoria));
    } catch (erro) {
      $("lista").replaceChildren(elemento("p", "evento erro", erro.message));
    }
  }

  function cartaoDeMemoria(m) {
    const cartao = elemento("div", "memoria");
    cartao.append(
      elemento("div", "cat", m.categoria),
      elemento("div", "", m.conteudo),
      elemento("div", "tempo", "válida de " + quando(m.valido_de) + " até " + quando(m.valido_ate)),
      elemento("div", "tempo", "origem: " + (m.origem || "—")),
    );
    const botao = elemento("button", "", "▸ ver histórico desta memória");
    botao.type = "button";
    botao.addEventListener("click", () => mostrarHistorico(m.memoria_id, cartao, botao));
    cartao.appendChild(botao);
    return cartao;
  }

  async function mostrarHistorico(memoriaId, cartao, botao) {
    const existente = cartao.querySelector(".versoes");
    if (existente) { existente.remove(); botao.textContent = "▸ ver histórico desta memória"; return; }
    botao.textContent = "▾ esconder histórico";
    botao.disabled = true;
    try {
      const dados = await chamar("/api/memorias/" + memoriaId + "/historico");
      const caixa = elemento("div", "versoes");
      for (const v of dados.versoes) {
        caixa.appendChild(elemento("div", "",
          "[" + v.status + "] " + v.conteudo +
          " · validade " + quando(v.valido_de) + " → " + quando(v.valido_ate) +
          " · registro " + quando(v.registrado_em) + " → " + quando(v.substituido_em)));
      }
      cartao.appendChild(caixa);
    } catch (erro) {
      cartao.appendChild(elemento("div", "versoes evento erro", erro.message));
    } finally {
      botao.disabled = false;
    }
  }

  $("modo").addEventListener("change", () => {
    $("instante").hidden = $("modo").value === "agora";
    carregarMemorias();
  });
  $("instante").addEventListener("change", carregarMemorias);
  $("atualizar").addEventListener("click", carregarMemorias);

  $("pessoa").addEventListener("change", async () => {
    const escolhido = $("pessoa").value;
    try {
      await postar("/api/pessoa", { dono_id: escolhido });
      dono = escolhido;
      conversa = lerConversa(dono);
      mostrarConversa();
      carregarMemorias();
    } catch (erro) {
      $("pessoa").value = dono;
      balao("⚠️ " + erro.message);
    }
  });

  $("esquecer").addEventListener("click", async () => {
    const nome = $("pessoa").selectedOptions[0].textContent;
    if (!confirm("Apagar fisicamente tudo o que o Brainiac sabe de " + nome + "? Não tem volta.")) return;
    const dados = await postar("/api/esquecer");
    balao("🧽 Esqueci " + dados.apagadas + " versão(ões). Quem é você mesmo?");
    carregarMemorias();
  });

  $("limpar").addEventListener("click", () => {
    conversa = [];
    gravarConversa(dono, conversa);
    mostrarConversa();
  });

  mostrarConversa();
  carregarMemorias();
</script>
</body>
</html>
